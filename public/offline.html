<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Offline | Vanta Transportation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #000; color: #e9eaec; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; text-align: center; }
  main { max-width: 30rem; }
  img { width: 96px; height: auto; margin-bottom: 1.5rem; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 1.9rem; color: #fff; margin: 0 0 .75rem; }
  p { margin: 0 0 1rem; color: #b9bcc1; }
  button { min-height: 48px; padding: .8rem 1.6rem; font: 600 1rem system-ui, sans-serif; background: #b9bcc1; color: #0a0a0a; border: 0; border-radius: 2px; cursor: pointer; }
  button:hover { background: #fff; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/brand/vanta-mark.svg" alt="">
  <h1>You're offline</h1>
  <p>Vanta Transportation needs an internet connection. Booking, payment, live ride tracking and driver chat all use up-to-date information, so they can't be shown without one.</p>
  <p>Please check your connection, then try again. Nothing you submitted while offline has been saved or sent.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
